<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
 </head>
<body>
  <main class="wrap">
    <section class="card" aria-label="Profile card">
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <g class="sun"><path d="M6.76 4.84l-1.8-1.79L3.17 4.84l1.79 1.79 1.8-1.79zM1 13h3v-2H1v2zm10-9h2V1h-2v3zm7.03 2.05l1.79-1.79-1.79-1.79-1.79 1.79 1.79 1.79zM17.24 19.16l1.79 1.79 1.79-1.79-1.79-1.79-1.79 1.79zM20 13h3v-2h-3v2zM11 20h2v3h-2v-3zM4.24 19.16l1.79-1.79-1.79-1.79-1.79 1.79 1.79 1.79zM12 6a6 6 0 100 12 6 6 0 000-12z"/></g>
          <g class="moon"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></g>
        </svg>
      </button>
      <div class="avatar">
        <img id="profile-img" src="img\img.png" alt="프로필 사진">
      </div>
      <h1 class="name">최원제</h1>
      <p class="tagline">네트워크 보안 엔지니어를 꿈꿉니다!</p>

      <div class="social" role="navigation" aria-label="Social links">
        <a class="icon" href="https://github.com/1J-Choi" target="_blank" rel="noopener" aria-label="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.38 7.86 10.9.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.53-1.36-1.3-1.72-1.3-1.72-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.78 2.72 1.27 3.38.97.11-.75.41-1.27.74-1.56-2.55-.29-5.23-1.28-5.23-5.71 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.47.11-3.07 0 0 .97-.31 3.18 1.18a11.04 11.04 0 0 1 2.9-.39c.98 0 1.97.13 2.9.39 2.2-1.5 3.17-1.18 3.17-1.18.63 1.6.24 2.78.12 3.07.74.81 1.19 1.84 1.19 3.1 0 4.44-2.69 5.41-5.25 5.69.42.36.8 1.06.8 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.68.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/></svg>
        </a>

        <a class="icon" href="https://www.youtube.com/" target="_blank" rel="noopener" aria-label="YouTube">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M23.5 6.2s-.2-1.6-.8-2.3c-.8-.9-1.7-.9-2.1-1C16.7 2.5 12 2.5 12 2.5s-4.7 0-8.6.4c-.4 0-1.3.1-2.1 1C.7 4.6.5 6.2.5 6.2S.2 8.1.2 10v4c0 1.9.3 3.8.3 3.8s.2 1.6.8 2.3c.8.9 1.8.9 2.3 1 1.7.2 7.4.4 7.4.4s4.7 0 8.6-.4c.4 0 1.3-.1 2.1-1 .6-.7.8-2.3.8-2.3s.3-1.9.3-3.8v-4c0-1.9-.3-3.8-.3-3.8zM9.8 15.5V8.5l6.5 3.5-6.5 3.5z"/></svg>
        </a>

        <a class="icon" href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm5 5.8A5.2 5.2 0 1 0 17.2 13 5.2 5.2 0 0 0 12 7.8zm6.4-2.1a1.2 1.2 0 1 1-1.2 1.2 1.2 1.2 0 0 1 1.2-1.2zM12 9.5A3.5 3.5 0 1 1 8.5 13 3.5 3.5 0 0 1 12 9.5z"/></svg>

      </div>
      
      <div id="links" class="links" aria-label="Links"> 
        <!-- 버튼은 script.js에서 렌더링됩니다 -->
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
